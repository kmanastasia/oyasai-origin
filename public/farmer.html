<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作り手｜OYASAI ORIGIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
<!-- 作り手 ↔ 手紙 だけ、画面の移り変わりをつなぐ（動きを減らす設定では使わない）。トップと書く側には置かない -->
<style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
<script>
// 移り変わりが進まない環境（動きが止められている）では、すぐ終えて新しい画面をそのまま出す。どんな環境でも 0.9 秒で終える。
addEventListener('pagereveal', function (event) {
  var transition = event.viewTransition;
  if (!transition) return;
  if (!document.querySelector('.card__lid')) { transition.skipTransition(); return; } // 相手の絵がまだ無ければ、古い絵だけを残さない（注記のない写真を出さない）
  var done = false;
  transition.finished.finally(function () { done = true; });
  setTimeout(function () {
    var moving = document.getAnimations().some(function (a) { return String(a.effect && a.effect.pseudoElement || '').indexOf('::view-transition') === 0 && a.currentTime > 0; });
    if (!done && !moving) transition.skipTransition();
  }, 80);
  setTimeout(function () { if (!done) transition.skipTransition(); }, 900);
});
</script>
<!-- 画面の中身を作るモジュールは head に置く（render-blocking は head の中でしか効かない。body の末尾では最初の描画が先に来て、③→④の移り変わりの絵が空のまま撮られる） -->
<script type="module" blocking="render" src="/farmer.js"></script>
</head>
<body class="reader page-farmer">
<!-- アイコン：Lucide（ISC。LICENSES/lucide.txt）。xmlns は書かない（HTML の中なので SVG として読まれる） -->

<symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></symbol>
<symbol id="i-shop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></symbol>
<symbol id="i-at" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></symbol>
<symbol id="i-languages" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></symbol>
<filter id="shu-ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="grain"/><feDisplacementMap in="SourceGraphic" in2="grain" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<template id="tpl-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow"></use></svg></template>
<template id="tpl-stamp"><svg class="stamp__svg" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><circle class="stamp__ink" cx="20" cy="20" r="18.6" filter="url(#shu-ink)"></circle><text class="stamp__char" x="20" y="20.5" text-anchor="middle" dominant-baseline="central">封</text></svg></template>
<div id="chrome" class="chrome"></div>
<div id="route"></div>
<main id="root" class="column"></main>
</body>
</html>
