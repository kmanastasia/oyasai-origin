<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封をする前に｜OYASAI ORIGIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body class="tool tool--seal">
<svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden">
<filter id="shu-ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="grain"/><feDisplacementMap in="SourceGraphic" in2="grain" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<template id="tpl-stamp"><svg class="stamp__svg" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><circle class="stamp__ink" cx="20" cy="20" r="18.6" filter="url(#shu-ink)"></circle><circle class="stamp__ring" cx="20" cy="20" r="16.4"></circle><text class="stamp__char" x="20" y="20.5" text-anchor="middle" dominant-baseline="central">封</text></svg></template>
<div id="chrome" class="chrome"></div>
<div id="route"></div>
<main id="root" class="seal-column"></main>
<script type="module" src="/seal.js"></script>
</body>
</html>
